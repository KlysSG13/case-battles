# Nginx-конфиг «Кейс-баттлов» (версионируется; baseline для порта 80).
# certbot --nginx допишет сюда 443/редиректы сам — правки certbot'а живут на сервере.
# Установка: provision-server.sh (или вручную: cp -> sites-available, symlink, nginx -t, reload).

server {
    listen 80;
    server_name edtechbattles.shop www.edtechbattles.shop;

    # Next.js (App Router) на 127.0.0.1:3000 — порт наружу не светим
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s; # долгие AI-оценки (до 60с таймаут LLM + ретрай)
    }

    client_max_body_size 10m;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml;
    gzip_vary on;
    gzip_min_length 1024;
}
